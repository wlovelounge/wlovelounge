
   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WLOVE LOUNGE</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid #eee;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav {
      display: flex;
      gap: 22px;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 14px;
      font-weight: bold;
    }

    /* HERO */
    .hero {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background: #f7f7f7;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h1 {
      font-size: clamp(48px, 10vw, 100px);
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 17px;
      color: #555;
      margin-bottom: 30px;
    }

    .shop-btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 3px;
    }

    /* SECTION */
    section {
      padding: 75px 6%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .section-title p {
      margin-top: 10px;
      color: #777;
    }

    /* PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background: #f7f7f7;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-image {
      width: 100%;
      height: 430px;
      overflow: hidden;
      background: #eee;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .product-info p {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .price {
      font-weight: 900;
      font-size: 18px;
    }

    /* NEW COLLECTION */
    .new-section {
      background: #111;
      color: white;
    }

    .new-section .section-title p {
      color: #aaa;
    }

    .new-products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      max-width: 1250px;
      margin: auto;
    }

    .new-card {
      background: #1c1c1c;
      overflow: hidden;
    }

    .new-image {
      width: 100%;
      height: 420px;
      overflow: hidden;
    }

    .new-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .new-info {
      padding: 20px;
    }

    .new-info h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .new-info p {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 15px;
    }
